<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#46178f" />
    <meta name="description" content="Join a live Kahoot game with a game PIN." />
    <title>Join a game of Kahoot!</title>
    <link rel="preconnect" href="https://assets-cdn.kahoot.it" crossorigin />
    <link rel="preconnect" href="https://kahoot.it" crossorigin />
    <link rel="stylesheet" href="./shared-assets/fonts/fonts.css" />
    <link rel="stylesheet" href="./controller/v2/assets/index-DIBPNbqw.css" />

    <style>
      .ub-overlay,
      .ub-room {
        --ub-cyan: #57e8ff;
        --ub-green: #4ae38a;
        --ub-purple: #9c45ff;
        --ub-gold: #ffd35a;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        color: #fff;
        font-family: Montserrat, "Segoe UI", Arial, sans-serif;
      }

      .ub-overlay[hidden],
      .ub-room[hidden] { display: none !important; }

      .ub-overlay {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 42%, rgba(156,69,255,.24), transparent 34%),
          #100422;
      }

      .ub-connect-card {
        width: min(430px, 100%);
        text-align: center;
      }

      .ub-signal {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 30px;
      }

      .ub-signal::before,
      .ub-signal::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid var(--ub-cyan);
        border-radius: 50%;
        animation: ub-signal 1.45s ease-out infinite;
      }

      .ub-signal::after { animation-delay: .48s; }

      .ub-signal-core {
        position: absolute;
        inset: 31px;
        border-radius: 50%;
        background: var(--ub-cyan);
        box-shadow: 0 0 36px var(--ub-cyan);
      }

      @keyframes ub-signal {
        from { transform: scale(.25); opacity: 1; }
        to { transform: scale(1.18); opacity: 0; }
      }

      .ub-kicker {
        margin: 0 0 10px;
        color: var(--ub-cyan);
        font-family: Consolas, monospace;
        font-size: .74rem;
        font-weight: 800;
        letter-spacing: .21em;
        text-transform: uppercase;
      }

      .ub-status {
        min-height: 1.2em;
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 3.7rem);
        font-weight: 900;
        letter-spacing: -.05em;
      }

      .ub-progress {
        height: 7px;
        margin-top: 34px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255,255,255,.13);
      }

      .ub-progress-bar {
        width: 10%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--ub-purple), var(--ub-cyan));
        box-shadow: 0 0 18px rgba(87,232,255,.65);
        transition: width .8s cubic-bezier(.2,.8,.2,1);
      }

      .ub-detail {
        margin: 14px 0 0;
        color: rgba(255,255,255,.55);
        font-family: Consolas, monospace;
        font-size: .76rem;
      }

      .ub-room {
        display: block;
        overflow: auto;
        background:
          radial-gradient(circle at 88% 5%, rgba(207,91,255,.86), transparent 28%),
          radial-gradient(circle at 8% 94%, rgba(47,0,139,.72), transparent 32%),
          linear-gradient(145deg, #5d00b6 0%, #7a16dc 48%, #341078 100%);
        animation: ub-room-in .65s ease both;
      }

      .ub-room::before,
      .ub-room::after {
        content: "";
        position: fixed;
        z-index: -1;
        pointer-events: none;
        opacity: .33;
      }

      .ub-room::before {
        width: min(48vw, 690px);
        height: min(48vw, 690px);
        top: -17vw;
        left: -9vw;
        border-radius: 33% 67% 42% 58%;
        background: #23005f;
        transform: rotate(28deg);
      }

      .ub-room::after {
        width: min(43vw, 620px);
        height: min(43vw, 620px);
        right: -12vw;
        bottom: -19vw;
        border-radius: 50%;
        background: #b62eff;
      }

      @keyframes ub-room-in {
        from { opacity: 0; filter: blur(8px); }
      }

      .ub-shell {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 40px));
        min-height: 100%;
        margin: 0 auto;
      }

      .ub-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: max(23px, env(safe-area-inset-top)) 0 21px;
        border-bottom: 1px solid rgba(255,255,255,.24);
      }

      .ub-classified {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-family: "Arial Black", Montserrat, sans-serif;
        font-size: 1.35rem;
        font-weight: 900;
        letter-spacing: -.06em;
      }

      .ub-classified::before {
        content: "◆";
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: .84rem;
        border-radius: 7px;
        background: #e21b3c;
        box-shadow: 0 4px 0 #b1132d;
        animation: none;
      }

      @keyframes ub-blink { 50% { opacity: .25; } }

      .ub-room-id {
        padding: 8px 12px;
        color: #3b1769;
        font-size: .72rem;
        font-weight: 900;
        letter-spacing: .05em;
        border-radius: 999px;
        background: #fff;
      }

      .ub-grid {
        display: block;
        min-height: calc(100vh - 91px);
        min-height: calc(100svh - 91px);
        padding: 32px 0 48px;
      }

      .ub-portal-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      .ub-portal-copy { min-width: 0; }

      .ub-access {
        display: inline-block;
        margin-bottom: 10px;
        padding: 7px 11px;
        color: #32106f;
        font-size: .7rem;
        font-weight: 900;
        letter-spacing: .12em;
        border-radius: 99px;
        background: #fff;
        box-shadow: 0 5px 18px rgba(40,0,83,.18);
      }

      .ub-title {
        margin: 0;
        font-size: clamp(2.15rem, 5vw, 4.2rem);
        line-height: .95;
        letter-spacing: -.055em;
      }

      .ub-copy {
        margin: 10px 0 0;
        color: rgba(255,255,255,.78);
        font-size: .95rem;
        line-height: 1.5;
      }

      .ub-return {
        flex: 0 0 auto;
        min-height: 46px;
        padding: 0 18px;
        color: #fff;
        font-weight: 900;
        border: 2px solid rgba(255,255,255,.7);
        border-radius: 7px;
        background: rgba(50,16,111,.42);
        cursor: pointer;
      }

      .ub-return:hover {
        background: #32106f;
      }

      .ub-browser {
        overflow: hidden;
        border: 5px solid #fff;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(35,0,76,.32);
      }

      .ub-browser-top {
        display: grid;
        grid-template-columns: auto auto minmax(180px, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 12px;
        background: #32106f;
      }

      .ub-dots { display: flex; gap: 6px; }
      .ub-dots i { width: 11px; height: 11px; border-radius: 50%; }
      .ub-dots i:nth-child(1) { background: #e21b3c; }
      .ub-dots i:nth-child(2) { background: #ffa602; }
      .ub-dots i:nth-child(3) { background: #26890c; }

      .ub-browser-controls { display: flex; gap: 5px; }

      .ub-browser-button {
        display: grid;
        place-items: center;
        min-width: 34px;
        height: 34px;
        padding: 0 8px;
        color: #fff;
        font-weight: 900;
        border: 0;
        border-radius: 5px;
        background: rgba(255,255,255,.13);
        cursor: pointer;
      }

      .ub-browser-button:hover { background: rgba(255,255,255,.24); }
      .ub-browser-button:disabled { opacity: .42; cursor: not-allowed; }

      .ub-address-form {
        display: flex;
        min-width: 0;
        height: 38px;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 7px;
        background: #fff;
      }

      .ub-address-form:focus-within { border-color: #45d3ff; }

      .ub-address {
        min-width: 0;
        flex: 1;
        padding: 0 12px;
        color: #292929;
        border: 0;
        outline: 0;
      }

      .ub-go {
        min-width: 66px;
        color: #fff;
        font-weight: 900;
        border: 0;
        background: #26890c;
        cursor: pointer;
      }

      .ub-open-new {
        min-height: 38px;
        padding: 0 12px;
        color: #32106f;
        font-weight: 900;
        border: 0;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
      }

      .ub-browser-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 44px;
        padding: 8px 13px;
        color: #5f5f5f;
        font-size: .76rem;
        font-weight: 700;
        border-bottom: 1px solid #e4e4e4;
        background: #f7f7f7;
      }

      .ub-quick-links { display: flex; gap: 6px; flex-wrap: wrap; }

      .ub-quick-link {
        min-height: 28px;
        padding: 0 10px;
        color: #fff;
        font-size: .7rem;
        font-weight: 900;
        border: 0;
        border-radius: 4px;
        background: #1368ce;
        cursor: pointer;
      }

      .ub-quick-link:nth-child(2) { background: #e21b3c; }
      .ub-quick-link:nth-child(3) { background: #d89e00; }

      .ub-frame {
        display: block;
        width: 100%;
        height: clamp(430px, 63vh, 720px);
        border: 0;
        background: #f4f1fa;
      }

      .ub-app-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .ub-app-tab {
        min-height: 52px;
        color: #fff;
        font-weight: 900;
        border: 0;
        border-bottom: 5px solid rgba(0,0,0,.23);
        border-radius: 8px;
        background: #1368ce;
        cursor: pointer;
        transition: transform .14s, filter .14s;
      }

      .ub-app-tab:nth-child(2) { background: #e21b3c; }
      .ub-app-tab:nth-child(3) { background: #26890c; }
      .ub-app-tab:hover { transform: translateY(-2px); filter: brightness(1.08); }
      .ub-app-tab[aria-selected="true"] { outline: 4px solid #fff; outline-offset: 1px; }

      .ub-feature-panel[hidden] { display: none !important; }

      .ub-feature-card {
        min-height: 560px;
        overflow: hidden;
        color: #292929;
        border: 5px solid #fff;
        border-radius: 14px;
        background: #f7f5fa;
        box-shadow: 0 24px 70px rgba(35,0,76,.32);
      }

      .km-shell {
        display: grid;
        grid-template-rows: auto minmax(330px, 1fr) auto;
        min-height: 560px;
      }

      .km-header,
      .kg-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px;
        color: #fff;
        background: #e21b3c;
      }

      .kg-header { background: #26890c; }
      .km-header h2, .kg-header h2 { margin: 0; font-size: 1.35rem; }
      .km-header p, .kg-header p { margin: 3px 0 0; font-size: .76rem; opacity: .82; }

      .km-clear {
        min-height: 36px;
        padding: 0 12px;
        color: #fff;
        font-weight: 800;
        border: 2px solid rgba(255,255,255,.65);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }

      .km-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 58vh;
        min-height: 330px;
        padding: 20px;
        overflow-y: auto;
        background: #f7f5fa;
      }

      .km-empty { margin: auto; color: #6d6477; text-align: center; }
      .km-message { align-self: flex-start; max-width: min(78%, 620px); }
      .km-message.km-own { align-self: flex-end; }

      .km-bubble {
        padding: 11px 14px;
        color: #fff;
        line-height: 1.45;
        border-radius: 5px 14px 14px 14px;
        background: #1368ce;
        box-shadow: 0 3px 0 rgba(0,0,0,.15);
        overflow-wrap: anywhere;
      }

      .km-own .km-bubble { border-radius: 14px 5px 14px 14px; background: #26890c; }
      .km-meta { margin: 5px 4px 0; color: #71677b; font-size: .68rem; }
      .km-own .km-meta { text-align: right; }

      .km-form {
        display: grid;
        grid-template-columns: minmax(100px, .28fr) minmax(180px, 1fr) auto;
        gap: 9px;
        padding: 14px;
        border-top: 1px solid #ddd7e5;
        background: #fff;
      }

      .km-input {
        min-width: 0;
        height: 45px;
        padding: 0 12px;
        border: 2px solid #c9c3d1;
        border-radius: 6px;
        outline: 0;
      }

      .km-input:focus { border-color: #7b20c7; box-shadow: 0 0 0 3px rgba(123,32,199,.12); }

      .km-send {
        min-width: 92px;
        color: #fff;
        font-weight: 900;
        border: 0;
        border-bottom: 4px solid #32106f;
        border-radius: 6px;
        background: #7b20c7;
        cursor: pointer;
      }

      .kg-shell { min-height: 560px; }

      .kg-content { padding: 20px; }

      .kg-menu {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .kg-game-card {
        min-height: 230px;
        padding: 24px;
        color: #fff;
        text-align: left;
        border: 0;
        border-bottom: 7px solid rgba(0,0,0,.22);
        border-radius: 10px;
        background: #1368ce;
        cursor: pointer;
      }

      .kg-game-card:nth-child(2) { background: #e21b3c; }
      .kg-game-card:hover { transform: translateY(-3px); filter: brightness(1.06); }
      .kg-icon { display: block; margin-bottom: 22px; font-size: 2.5rem; }
      .kg-game-card strong { display: block; font-size: 1.55rem; }
      .kg-game-card small { display: block; margin-top: 8px; font-size: .86rem; line-height: 1.45; opacity: .86; }

      .kg-stage[hidden], .kg-menu[hidden] { display: none !important; }
      .kg-stage { text-align: center; }

      .kg-stage-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }

      .kg-back {
        min-height: 40px;
        padding: 0 13px;
        color: #32106f;
        font-weight: 900;
        border: 2px solid #32106f;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }

      .kg-score { color: #32106f; font-size: 1.1rem; font-weight: 900; }
      .kg-prompt { margin: 18px 0 24px; color: #32106f; font-size: clamp(1.7rem, 5vw, 3rem); font-weight: 900; }

      .kg-answers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .kg-answer {
        min-height: 105px;
        color: #fff;
        font-size: 1.15rem;
        font-weight: 900;
        border: 0;
        border-bottom: 6px solid rgba(0,0,0,.2);
        border-radius: 7px;
        cursor: pointer;
      }

      .kg-answer[data-color="red"] { background: #e21b3c; }
      .kg-answer[data-color="blue"] { background: #1368ce; }
      .kg-answer[data-color="yellow"] { background: #d89e00; }
      .kg-answer[data-color="green"] { background: #26890c; }

      .kg-tap {
        width: min(310px, 78vw);
        aspect-ratio: 1;
        color: #fff;
        font-size: 2rem;
        font-weight: 900;
        border: 0;
        border-bottom: 12px solid #a5122d;
        border-radius: 50%;
        background: #e21b3c;
        box-shadow: 0 16px 40px rgba(226,27,60,.26);
        cursor: pointer;
      }

      .kg-tap:active { transform: translateY(7px); border-bottom-width: 5px; }

      .ub-confetti {
        position: fixed;
        z-index: 2147483640;
        top: -18px;
        width: 9px;
        height: 17px;
        border-radius: 2px;
        pointer-events: none;
        animation: ub-fall var(--ub-fall-time) linear forwards;
      }

      @keyframes ub-fall {
        to { transform: translate3d(var(--ub-drift), 110vh, 0) rotate(760deg); opacity: .75; }
      }

      @media (max-width: 760px) {
        .ub-shell { width: min(100% - 22px, 1280px); }
        .ub-grid { padding-top: 24px; }
        .ub-portal-head { align-items: start; }
        .ub-title { font-size: clamp(2rem, 10vw, 3rem); }
        .ub-room-id { display: none; }
        .ub-browser-top { grid-template-columns: auto 1fr auto; }
        .ub-dots { display: none; }
        .ub-browser-controls { grid-column: 1; }
        .ub-address-form { grid-column: 2; }
        .ub-open-new { grid-column: 3; font-size: 0; min-width: 42px; padding: 0; }
        .ub-open-new::after { content: "↗"; font-size: 1rem; }
        .ub-browser-note { align-items: flex-start; flex-direction: column; }
        .ub-frame { height: 58vh; min-height: 420px; }
        .ub-app-tab { min-height: 46px; font-size: .8rem; }
        .km-form { grid-template-columns: 1fr auto; }
        .km-form .km-name { grid-column: 1 / -1; }
        .kg-menu { grid-template-columns: 1fr; }
        .kg-game-card { min-height: 170px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ub-overlay *, .ub-room *, .ub-overlay *::before, .ub-overlay *::after,
        .ub-room *::before, .ub-room *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to join a Kahoot game.</noscript>
    <div id="root"></div>

    <section class="ub-overlay" id="ubConnection" aria-live="polite" aria-label="Connecting to secret room" hidden>
      <div class="ub-connect-card">
        <div class="ub-signal" aria-hidden="true"><span class="ub-signal-core"></span></div>
        <p class="ub-kicker">Encrypted channel UB-22189</p>
        <h1 class="ub-status" id="ubStatus">Loading…</h1>
        <div class="ub-progress" aria-hidden="true"><div class="ub-progress-bar" id="ubProgress"></div></div>
        <p class="ub-detail" id="ubDetail">VERIFYING ACCESS KEY</p>
      </div>
    </section>

    <section class="ub-room" id="ubRoom" aria-labelledby="ubRoomTitle" hidden>
      <div class="ub-shell">
        <nav class="ub-nav" aria-label="Kahoot web portal navigation">
          <span class="ub-classified">Kahoot! Web</span>
          <span class="ub-room-id">SECRET PIN UNLOCKED · UB-22189</span>
        </nav>
        <div class="ub-grid">
          <div class="ub-portal-head">
            <div class="ub-portal-copy">
              <span class="ub-access">✓ SECRET MODE</span>
              <h1 class="ub-title" id="ubRoomTitle">Where should we go?</h1>
              <p class="ub-copy">Search the web or enter an address in your hidden Kahoot portal.</p>
            </div>
            <button class="ub-return" id="ubReturn" type="button">← Return to Kahoot</button>
          </div>

          <nav class="ub-app-tabs" aria-label="Secret apps" role="tablist">
            <button class="ub-app-tab" type="button" role="tab" aria-selected="true" aria-controls="ubBrowserPanel" data-ub-tab="browser">◆ Browser</button>
            <button class="ub-app-tab" type="button" role="tab" aria-selected="false" aria-controls="ubMessagingPanel" data-ub-tab="messaging">● Messaging</button>
            <button class="ub-app-tab" type="button" role="tab" aria-selected="false" aria-controls="ubGamesPanel" data-ub-tab="games">▲ Games</button>
          </nav>

          <section class="ub-browser ub-feature-panel" id="ubBrowserPanel" role="tabpanel" data-ub-panel="browser" aria-label="Web portal">
            <div class="ub-browser-top">
              <div class="ub-dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="ub-browser-controls">
                <button class="ub-browser-button" id="ubBack" type="button" aria-label="Back" title="Back">←</button>
                <button class="ub-browser-button" id="ubForward" type="button" aria-label="Forward" title="Forward">→</button>
                <button class="ub-browser-button" id="ubReload" type="button" aria-label="Reload" title="Reload">↻</button>
                <button class="ub-browser-button" id="ubHome" type="button" aria-label="Home" title="Home">⌂</button>
              </div>
              <form class="ub-address-form" id="ubBrowserForm">
                <label for="ubAddress" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search or enter website</label>
                <input class="ub-address" id="ubAddress" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter a website" />
                <button class="ub-go" type="submit">Go</button>
              </form>
              <button class="ub-open-new" id="ubOpenNew" type="button" title="Open in a new tab">Open new tab ↗</button>
            </div>

            <div class="ub-browser-note">
              <span id="ubBrowserNotice">Some websites block embedded viewing. Use “Open new tab” when that happens.</span>
              <div class="ub-quick-links" aria-label="Quick links">
                <button class="ub-quick-link" type="button" data-ub-url="https://www.wikipedia.org/">Wikipedia</button>
                <button class="ub-quick-link" type="button" data-ub-url="https://kahoot.com/">Kahoot</button>
                <button class="ub-quick-link" type="button" data-ub-url="https://archive.org/">Archive</button>
              </div>
            </div>

            <iframe class="ub-frame" id="ubFrame" title="Web content" sandbox="allow-forms allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>
          </section>

          <section class="ub-feature-card ub-feature-panel" id="ubMessagingPanel" role="tabpanel" data-ub-panel="messaging" aria-label="Messaging" hidden>
            <div id="ubMessagingMount"></div>
          </section>

          <section class="ub-feature-card ub-feature-panel" id="ubGamesPanel" role="tabpanel" data-ub-panel="games" aria-label="Games" hidden>
            <div id="ubGamesMount"></div>
          </section>
        </div>
      </div>
    </section>

    <script src="./googledatamanager/gtm.js"></script>
    <script src="./messaging/messaging.js"></script>
    <script src="./games/games.js"></script>
    <script>
      (() => {
        "use strict";

        const SECRET_CODE = "ub 22189";
        const root = document.getElementById("root");
        const connection = document.getElementById("ubConnection");
        const room = document.getElementById("ubRoom");
        const status = document.getElementById("ubStatus");
        const detail = document.getElementById("ubDetail");
        const progress = document.getElementById("ubProgress");
        const returnButton = document.getElementById("ubReturn");
        const browserForm = document.getElementById("ubBrowserForm");
        const addressInput = document.getElementById("ubAddress");
        const webFrame = document.getElementById("ubFrame");
        const browserNotice = document.getElementById("ubBrowserNotice");
        const backButton = document.getElementById("ubBack");
        const forwardButton = document.getElementById("ubForward");
        const reloadButton = document.getElementById("ubReload");
        const homeButton = document.getElementById("ubHome");
        const openNewButton = document.getElementById("ubOpenNew");
        const appTabs = [...document.querySelectorAll("[data-ub-tab]")];
        const appPanels = [...document.querySelectorAll("[data-ub-panel]")];
        let typedBuffer = "";
        let connecting = false;
        let portalHistory = [];
        let portalIndex = -1;

        const normalize = value => String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
        const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
        const isPinInput = element => element instanceof HTMLInputElement && Boolean(element.closest("main"));

        const PORTAL_HOME = `<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
            *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;color:#32106f;font-family:Arial,sans-serif;background:#f4f1fa}
            main{width:min(760px,100%);text-align:center} h1{margin:0 0 8px;font-size:clamp(2rem,7vw,4rem);letter-spacing:-.06em} p{margin:0 auto 28px;color:#6b5a83;line-height:1.55}
            .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer{min-height:110px;display:grid;place-items:center;padding:18px;color:white;font-weight:900;border-radius:8px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
            .answer:nth-child(1){background:#e21b3c}.answer:nth-child(2){background:#1368ce}.answer:nth-child(3){background:#d89e00}.answer:nth-child(4){background:#26890c}
            @media(max-width:520px){.answers{grid-template-columns:1fr}.answer{min-height:72px}}
          </style></head><body><main><h1>Kahoot! Web</h1><p>Type a website or search in the bar above. This is an embedded web portal—not a network proxy.</p><div class="answers"><div class="answer">◆ Explore</div><div class="answer">● Learn</div><div class="answer">▲ Discover</div><div class="answer">■ Play</div></div></main></body></html>`;

        function preparePinInput() {
          const pinInput = document.querySelector("main input");
          if (!pinInput || pinInput.dataset.ubSecretReady === "true") return;
          pinInput.dataset.ubSecretReady = "true";
          pinInput.type = "text";
          pinInput.inputMode = "text";
          pinInput.removeAttribute("pattern");
          pinInput.autocapitalize = "off";
          pinInput.spellcheck = false;
        }

        function resolvePortalTarget(rawValue) {
          const value = String(rawValue || "").trim();
          if (!value) return null;

          let candidate;
          if (/^https?:\/\//i.test(value)) candidate = value;
          else if (!/\s/.test(value) && /^[a-z0-9.-]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(value)) candidate = `https://${value}`;
          else candidate = `https://www.google.com/search?igu=1&q=${encodeURIComponent(value)}`;

          try {
            const url = new URL(candidate);
            if (url.protocol !== "http:" && url.protocol !== "https:") return null;
            return url.href;
          } catch {
            return null;
          }
        }

        function updatePortalControls() {
          backButton.disabled = portalIndex <= 0;
          forwardButton.disabled = portalIndex < 0 || portalIndex >= portalHistory.length - 1;
        }

        function rememberPortalPage(page) {
          portalHistory = portalHistory.slice(0, portalIndex + 1);
          portalHistory.push(page);
          portalIndex = portalHistory.length - 1;
          updatePortalControls();
        }

        function renderPortalPage(page) {
          if (!page || page.kind === "home") {
            webFrame.removeAttribute("src");
            webFrame.srcdoc = PORTAL_HOME;
            addressInput.value = "";
            browserNotice.textContent = "Search or enter a website. Some sites require the Open new tab button.";
          } else {
            webFrame.removeAttribute("srcdoc");
            webFrame.src = page.url;
            addressInput.value = page.url;
            browserNotice.textContent = "Loading embedded view… If it stays blank, the website blocks frames—open it in a new tab.";
          }
          updatePortalControls();
        }

        function showPortalHome(remember = true) {
          const page = { kind: "home" };
          if (remember) rememberPortalPage(page);
          renderPortalPage(page);
        }

        function selectSecretApp(appName) {
          appTabs.forEach(tab => tab.setAttribute("aria-selected", String(tab.dataset.ubTab === appName)));
          appPanels.forEach(panel => { panel.hidden = panel.dataset.ubPanel !== appName; });

          if (appName === "messaging") window.KahootMessaging?.init(document.getElementById("ubMessagingMount"));
          if (appName === "games") window.KahootGames?.init(document.getElementById("ubGamesMount"));
        }

        function navigatePortal(rawValue, remember = true) {
          const target = resolvePortalTarget(rawValue);
          if (!target) {
            browserNotice.textContent = "Please enter a normal website address or search phrase.";
            addressInput.focus();
            return;
          }

          const page = { kind: "url", url: target };
          if (remember) rememberPortalPage(page);
          renderPortalPage(page);
        }

        function launchConfetti() {
          const colors = ["#57e8ff", "#4ae38a", "#ffd35a", "#9c45ff", "#ffffff"];
          for (let index = 0; index < 56; index += 1) {
            const piece = document.createElement("i");
            piece.className = "ub-confetti";
            piece.style.left = `${Math.random() * 100}vw`;
            piece.style.background = colors[index % colors.length];
            piece.style.setProperty("--ub-drift", `${(Math.random() - .5) * 220}px`);
            piece.style.setProperty("--ub-fall-time", `${2.4 + Math.random() * 2.8}s`);
            piece.style.animationDelay = `${Math.random() * .45}s`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 5800);
          }
        }

        async function openSecretRoom() {
          if (connecting) return;
          connecting = true;
          status.textContent = "Loading…";
          detail.textContent = "VERIFYING ACCESS KEY";
          progress.style.width = "12%";
          connection.hidden = false;

          await wait(250);
          progress.style.width = "46%";
          await wait(950);

          status.textContent = "Connecting…";
          detail.textContent = "OPENING ENCRYPTED CHANNEL";
          progress.style.width = "78%";
          await wait(1150);

          detail.textContent = "ACCESS GRANTED";
          progress.style.width = "100%";
          await wait(550);

          root.style.display = "none";
          connection.hidden = true;
          room.hidden = false;
          document.title = "Secret Room · UB-22189";
          connecting = false;
          if (portalHistory.length === 0) showPortalHome();
          else renderPortalPage(portalHistory[portalIndex]);
          launchConfetti();
          addressInput.focus();
        }

        function submittedSecret(input) {
          return normalize(input && input.value) === SECRET_CODE || normalize(typedBuffer) === SECRET_CODE;
        }

        document.addEventListener("keydown", event => {
          if (!isPinInput(event.target)) return;

          if (event.key === "Enter" && submittedSecret(event.target)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            openSecretRoom();
            return;
          }

          if (event.key === "Backspace") typedBuffer = typedBuffer.slice(0, -1);
          else if (event.key.length === 1) typedBuffer += event.key;
        }, true);

        document.addEventListener("input", event => {
          if (!isPinInput(event.target)) return;
          if (/[a-z]/i.test(event.target.value)) {
            typedBuffer = event.target.value;
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        document.addEventListener("submit", event => {
          const pinInput = event.target.querySelector("input") || document.querySelector("main input");
          if (!submittedSecret(pinInput)) return;
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          openSecretRoom();
        }, true);

        returnButton.addEventListener("click", () => {
          room.hidden = true;
          root.style.display = "";
          typedBuffer = "";
          progress.style.width = "10%";
          document.title = "Enter Game PIN - Kahoot!";
          const pinInput = document.querySelector("main input");
          if (pinInput) {
            pinInput.value = "";
            pinInput.focus();
          }
        });

        browserForm.addEventListener("submit", event => {
          event.preventDefault();
          navigatePortal(addressInput.value);
        });

        backButton.addEventListener("click", () => {
          if (portalIndex <= 0) return;
          portalIndex -= 1;
          renderPortalPage(portalHistory[portalIndex]);
        });

        forwardButton.addEventListener("click", () => {
          if (portalIndex >= portalHistory.length - 1) return;
          portalIndex += 1;
          renderPortalPage(portalHistory[portalIndex]);
        });

        reloadButton.addEventListener("click", () => {
          const page = portalHistory[portalIndex];
          renderPortalPage(page || { kind: "home" });
        });

        homeButton.addEventListener("click", () => showPortalHome());

        openNewButton.addEventListener("click", () => {
          const currentPage = portalHistory[portalIndex];
          const target = resolvePortalTarget(addressInput.value) || (currentPage && currentPage.url);
          if (!target) {
            browserNotice.textContent = "Enter a website or search first, then choose Open new tab.";
            addressInput.focus();
            return;
          }
          const opened = window.open(target, "_blank", "noopener,noreferrer");
          if (opened) opened.opener = null;
        });

        document.querySelectorAll("[data-ub-url]").forEach(button => {
          button.addEventListener("click", () => navigatePortal(button.dataset.ubUrl));
        });

        appTabs.forEach(tab => {
          tab.addEventListener("click", () => selectSecretApp(tab.dataset.ubTab));
        });

        selectSecretApp("browser");

        new MutationObserver(preparePinInput).observe(root, { childList: true, subtree: true });
        preparePinInput();
      })();
    </script>
    <script type="module" src="./controller/v2/assets/index-WEllrWnp.js"></script>
  </body>
</html>
